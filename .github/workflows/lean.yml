name: Lean

# Always triggers, so the required `Lean CI` check is always reported (a
# workflow skipped by `on.paths` would leave a required check pending and
# block merges). The heavy build is instead gated on a path filter computed
# inside the run: it is skipped only when the change is provably irrelevant
# to Lean (touches nothing but non-Lean files under book/). Erring toward
# running keeps a malicious PR from silently dodging the build by editing a
# Lean-relevant file.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect Lean-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      lean: ${{ steps.filter.outputs.lean }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # dorny/paths-filter compiles each rule to its own picomatch matcher and
      # ORs them, so a change is Lean-relevant iff some changed file is either
      # not under book/ (and not the root README.md, which is book content
      # included into the book) or is a .lean file (anywhere). Note this is NOT
      # the sequential-negation semantics of GitHub's own `on.paths` engine.
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            lean:
              - '!{book/**,README.md}'
              - '**/*.lean'

  build:
    name: Build the Zcash formalization
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Content-pins the checked-in circuit VK fixtures (the `.json` CS/layout dumps
      # consumed by `CircuitCheck`). The Lean build does not recompute a hash — there
      # is no fast SHA-256 in the toolchain — so this OS `sha256sum -c` is the
      # cryptographic drift/tamper guard, complementing the `TestVk*` reconstruction that
      # checks the fixtures against the Lean circuit model. See `Zcash/Circuits/Fixtures/`.
      # The first `diff` fails if SHA256SUMS does not list *exactly* the committed `.json`
      # fixtures, so a newly added fixture can never slip in content-unpinned. The last one
      # fails if `Stamp.lean` — the pins rendered as Lean data, which is what carries a
      # fixture change into Lake's import graph — is stale against SHA256SUMS; without it a
      # refreshed fixture could keep the stale stamp and go on skipping the `#eval` locally.
      - name: Verify circuit fixture content hashes
        working-directory: Zcash/Circuits/Fixtures
        run: |
          diff <(ls *.json | sort) <(awk '{print $2}' SHA256SUMS | sort) \
            || { echo "::error::SHA256SUMS must list exactly the committed *.json fixtures"; exit 1; }
          sha256sum -c SHA256SUMS
          diff Stamp.lean <(./stamp.sh) \
            || { echo "::error::Stamp.lean is stale; regenerate with ./stamp.sh > Stamp.lean"; exit 1; }
      # Every @[csimp] replacement lemma must have its own assert_axioms entry in
      # Zcash/TrustBoundary.lean: csimp-proof axioms are not propagated into downstream
      # native_decide axiom tracking (lean4#7463).
      - name: Verify csimp lemmas are axiom-censused
        run: scripts/check_csimp_census.sh
      # No Lean file may import the Mathlib umbrella module: `import Mathlib` peaks around
      # 6.5 GB RSS per Lean process, and nothing else fails when it creeps back in — builds
      # just quietly get slow again. Import the specific Mathlib modules instead.
      - name: Verify no Mathlib umbrella imports
        run: scripts/check_no_umbrella_imports.sh
      # Every deliverable soundness endpoint must be named in an assert_axioms/assert_computable
      # entry in a TrustBoundary.lean. The census macros collect a declaration's *dependencies*,
      # so a top-level capstone that nothing pinned depends on is invisible to all of them —
      # exactly the shape the advertised endpoints have. `--wfail` below catches a `sorry` in
      # such a leaf, but not a stray native_decide or other unexpected axiom; the pin does.
      - name: Verify soundness endpoints are axiom-censused
        run: scripts/check_endpoint_census.sh
      # Installs the toolchain from lean-toolchain, fetches the Mathlib olean cache, and runs
      # `lake build --wfail`, which rejects all warnings and builds the lakefile's
      # `defaultTargets`: `Zcash`, `FixtureCheck`, `CircuitCheck`, and `MetaCheck`.
      #
      # `Zcash` imports the fixture-free top-level trust census. Concrete capstone census entries
      # live beside their captures and are built through `FixtureCheck`.
      #
      # `FixtureCheck` covers the deployed Action/Vesta capstone lane, whose
      # `Keygen/Certificate.lean` natively certifies the deployed verifying key against the
      # derivation (~45 s). It also elaborates `Zcash.Snark.Fingerprint.Fixture`, whose
      # `fingerprint_matches := by native_decide` compiles and *runs* the Lean verifier
      # `assemble` on the captured proof — the authoritative whole-path computability check,
      # since anything noncomputable on that path fails to compile. Its sorry-freeness and
      # axiom set are pinned by `Zcash.Snark.Fingerprint.TrustBoundary`.
      #
      # `CircuitCheck` covers `Zcash/Circuits/Tests/TestVk*`, which compare the ported
      # `configure`/`synthesize` against the CS and layout fixtures dumped from the Rust
      # circuit, so a divergence between the Lean circuit model and the deployed VK fails here.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build-args: "--wfail"
      # The ActionGarden translation is generated from Lean's parser tree by a
      # deliberately non-default executable. Exercise its closed subset,
      # mutation regressions, and checked-in review diff after lean-action has
      # installed the pinned toolchain.
      - name: Verify the ActionGarden Lean-to-Rocq translator
        run: |
          lake --wfail build actionGardenToIR
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v \
            Zcash/Circuits/Action/IronwoodGardenActionBridge/test_lean_to_rocq.py
          bridge=Zcash/Circuits/Action/IronwoodGardenActionBridge
          generated="$(mktemp -d)"
          trap 'rm -rf "$generated"' EXIT
          python3 "$bridge/lean_to_rocq.py" \
            "$bridge/ActionGarden.lean" \
            "$generated/action_garden_generated.v" \
            --constants-output "$generated/action_garden_constants.v"
          python3 "$bridge/lean_to_rocq.py" \
            "$bridge/ActionGarden.lean" \
            "$generated/action_garden_generated.v" \
            --constants-output "$generated/action_garden_constants.v" \
            --diff "$bridge/ActionGarden.lean-rocq.diff" \
            --check

  lean-ci:
    # The single stable check to mark as a required status check. It always
    # runs, so it always reports; it fails only if the build actually failed.
    name: Lean CI
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the build result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "The changes-detection job did not succeed."
            exit 1
          fi
          case "$BUILD_RESULT" in
            success|skipped)
              echo "Lean build passed or was not required for this change." ;;
            *)
              echo "Lean build result: $BUILD_RESULT."
              exit 1 ;;
          esac
