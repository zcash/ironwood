name = "Zcash"
version = "0.1.0"
keywords = ["cryptography", "math", "protocols"]
defaultTargets = ["Zcash", "FixtureCheck", "CircuitCheck", "MetaCheck", "SecurityCheck", "CensusCheck"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "Clean"
git = "https://github.com/Verified-zkEVM/clean"
rev = "b0366bf1"

[[require]]
name = "CompElliptic"
git = "https://github.com/daira/CompElliptic"
# CompElliptic main, at the merge of the Weil-bound reduction (PR #29).
rev = "2c0444035a84db957f27f06433715058d1e890ad"

# mathlib last, so that its pinned versions of the common transitive dependencies
# (batteries, aesop, Qq, proofwidgets, ...) take precedence over CompPoly's.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

# `Zcash.lean` is this library's only import root, so the root glob alone builds exactly its
# transitive closure. Since `Zcash/Snark.lean` stopped re-exporting `Soundness/` (the
# byte-locked fixture captures must `import Zcash.Snark`, and re-exporting the soundness
# argument there put the whole subtree on every capture lane's build path), the `Soundness/`
# modules reach that closure only through the census imports in `Zcash/TrustBoundary.lean`.
#
# That is real coverage, but incidental: `TrustBoundary` imports those modules in order to NAME
# their declarations in `assert_axioms`/`assert_computable` pins, not to use their contents. So
# retiring a pin or moving an endpoint to another module would change which files get elaborated
# at all — a strange thing for an audit file to control, and silent when it happens.
#
# The `Soundness.+` glob is a backstop against precisely that, and it is honest to say it is not
# what is doing the work today: at the time of writing every `Soundness/` module is already
# reachable from the default targets without it, and dropping it leaves `lake build`'s job count
# unchanged (it adds six jobs to a bare `lake build Zcash` — the capstone- and test-adjacent
# modules that otherwise arrive only via `FixtureCheck` and `MetaCheck`).
#
# Listing those modules in `Zcash.lean` instead would put coverage back on imports, but at the
# cost of a hand-maintained list that every new `Soundness/` module must be added to — the
# maintenance the globs on `FixtureCheck`, `MetaCheck`, and `CircuitCheck` exist to avoid.
# Either way `scripts/check_build_coverage.sh` (CI) asserts the end-to-end property: every
# module file in the package is reachable from some default target.
#
# `Snark.Contract.+` is the same backstop for the same reason. The auditor-facing contract layer
# reaches the closure today only because `TrustBoundary` pins its declarations, which is exactly
# the incidental coverage described above.
[[lean_lib]]
name = "Zcash"
globs = ["Zcash", "Zcash.Snark.Soundness.+", "Zcash.Snark.Contract.+"]

# Test-only adversarial declarations for `Zcash.Meta.AxiomCheck`. This is a separate library so
# forged axioms used to exercise the rejection paths never enter the production `Zcash` import
# graph, while the default build still runs the regression checks in CI.
[[lean_lib]]
name = "MetaCheck"
globs = ["Zcash.Meta.Tests.+"]

# Everything under `Zcash/Snark/Fixtures/` is instance-level: the generated Rust<->Lean captures
# (per-capture subdirectories -- `SingleAction/Honest`, `MultiAction/Honest`, and their match-only
# `Random` siblings -- holding the fixture data plus its Fiat–Shamir schedule, faithfulness, and
# negative checks) plus the shared helpers (`Shared/`) and the cross-capture provenance modules
# (`PostNu63`, `PostNu63Random`). The `Zcash` library deliberately does not import them (the captures are
# large, generated, and slow); `Zcash/Snark/Fingerprint/` keeps the reusable match/soundness theory.
# This dedicated target keeps the fixtures out of `lake build Zcash` for local dev, while plain
# `lake build` (the default targets -- what CI runs) compiles them, so the empirical checks are
# exercised alongside the parametric verifier obligations in `Zcash`. New modules under `Fixtures/`
# and `Capstones/` are picked up by the globs automatically. `Capstones/` holds the advertised
# endpoints; they are instance-level for the same reason -- they are stated at the captured Action
# parameters and reach the captures through their imports, which is also how they pull in the
# verifying-key COMMITMENT certificate chain `Keygen/Certificate`. The glob is explicit rather than
# left to the census file's imports, so an endpoint stays built even if nothing pins it.
#
# `Keygen/Certificate` and `Keygen/InstanceCapture` (the ironwood#86 join of the captured
# instance commitments to the circuit-derived family) are pinned explicitly: InstanceCapture has
# no importer, and Certificate is otherwise reachable only through the capstone entries' imports.
[[lean_lib]]
name = "FixtureCheck"
globs = [
  "Zcash.Snark.Fixtures.+",
  "Zcash.Snark.Capstones.+",
  "Zcash.Snark.Keygen.Certificate",
  "Zcash.Snark.Keygen.InstanceCapture",
]

# The circuit-side VK matching and layout tests: `Zcash/Circuits/Tests/TestVk*` compare the
# ported `configure`/`synthesize` against the CS and layout fixtures dumped from the actual
# Rust circuit (see `Zcash/Circuits/Fixtures/`). Like `FixtureCheck`, these are `#eval`-checked
# empirical bindings kept out of `lake build Zcash`, but compiled by plain `lake build`
# (what CI runs) so a divergence between the Lean circuit model and the deployed VK fails the
# build. The glob covers the whole directory, so a newly added test cannot land in no target
# at all; that also pulls in `BenchFixedBase`, a pure kernel-`decide` benchmark, which is
# cheap enough at its current size to keep honest alongside the rest.
[[lean_lib]]
name = "CircuitCheck"
globs = ["Zcash.Circuits.Tests.+"]

# `Zcash/Security/Ledger/BridgeTests.lean` — the regression checks guarding the protocol
# distinctions a type-correct refinement can silently erase (signed value semantics, scalar
# randomization, raw Merkle encodings, the dummy-spend guard, the three-valued cross-address flag).
# Same reason as `MetaCheck`: a check module is where a smoke lemma stated too strongly, or an
# axiom added to reproduce a bug, is least likely to draw review, so it does not belong in the
# production `Zcash` import graph that downstream users get. It is not reached from `Zcash.Security`
# (nothing outside the file references its declarations), and its own `assert_axioms` entries pin
# its trusted base either way; this target keeps the default build running them.
[[lean_lib]]
name = "SecurityCheck"
globs = ["Zcash.Security.Ledger.BridgeTests"]

# `Zcash/CensusCheck.lean` — the endpoint census enforced a second time, from the elaborated
# environment: it imports every census (TrustBoundary) file and asserts that each endpoint-named
# declaration in that closure carries a direct pin recorded by an elaborated
# `assert_axioms`/`assert_computable` entry (`Zcash.Meta.EndpointCensus`). This closes the
# surface-syntax evasions `scripts/check_endpoint_census.sh`'s line parser cannot see — custom
# declaration commands, unrecognized modifiers, multiline syntax, declaration-emitting
# metaprogramming — while the script keeps the wider file-tree scope.
[[lean_lib]]
name = "CensusCheck"
globs = ["Zcash.CensusCheck"]
