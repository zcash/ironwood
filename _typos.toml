[files]
# Vendored assets and generated output are not spell-checked.
extend-exclude = [
  "*.js",
  "*.css",
  "*.json",
  "*.svg",
  "*.lock",
  "SHA256SUMS",
  "LICENSE-*",
  "book/book/",
  "scripts/generated/",
  "target/",
]

[default]
# Lean proofs use many short hypothesis names (`hae`, `hve`, `hb`, `ih`, etc.) that the spell-checker
# misreads as typos. Skip identifiers of three or fewer characters rather than whitelisting each one;
# genuine typos that short are vanishingly rare and not worth the steady stream of false positives.
#
# Random oracles follow the spec's `H^{name}` convention, rendered in Lean as an `H` prefix (e.g.
# `Hask` for `H^ask`). Allow an `H` followed by three alphanumeric characters so these aren't misread
# (`Hask` -> `Hash`, etc.).
extend-ignore-identifiers-re = [
  "^[A-Za-z0-9_]{1,3}$",
  "^H[A-Za-z0-9]{3}$",
]

[default.extend-words]
thr = "thr"  # threshold identifiers (`thr`, `thr1`, `thr4`) in Composition/Completeness
hsi = "hsi"  # hypothesis identifiers (`hsiN`) in Verifier/Assemble
henc = "henc"  # hypothesis identifier (`henc`) in Circuits/Integration/ActionCopyWitness
padd = "padd"  # projective point addition (`padd`) in Vendor/CompPoly/ScalarFftDefs
Hom = "Hom"  # `RingHom`, `evalRingHom` — Mathlib's homomorphism naming
thm = "thm"  # `.thmInfo` is Lean core's `ConstantInfo` constructor for theorems
advices = "advices"
colinear = "colinear"  # deliberate English spelling; we are not writing Latin
